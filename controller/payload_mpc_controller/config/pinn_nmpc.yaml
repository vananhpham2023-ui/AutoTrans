# using receved time (only for one traj )
use_simulation: true 
use_fix_yaw: false   # using fix yaw. 

# Reference generation configuration (Stage 1 defaults keep planner enabled)
reference:
    use_planner: true
    mode: figure_eight  # circle | figure_eight | helix
    circle:
        radius: 5.0               # [m] radius of the circle
        angular_velocity: 0.5     # [rad/s] positive for CCW
        center: [0.0, 0.0]        # [m] xy center offset in map frame
        altitude: 2.0             # [m] constant altitude
    figure_eight:
        radius: 5.0               # [m] lissajous major radius
        angular_velocity: 0.5     # [rad/s] temporal scaling
        center: [0.0, 0.0]        # [m] xy center offset in map frame
        altitude: 2.0             # [m] constant altitude
    helix:
        radius: 4.0               # [m] radial distance from center
        angular_velocity: 0.4     # [rad/s] revolution rate
        center: [0.0, 0.0]        # [m] xy center offset in map frame
        base_altitude: 1.5        # [m] starting altitude
        vertical_rate: 0.4        # [m/s] climb speed
        revolutions: 3.0          # total turns for a finite-length helix

# Cost on states
Q_pos_xy:   500.0    # Cost for horizontal positon error //default: 200     0.5 
Q_pos_z:  500.0    # Cost for horizontal positon error //default: 200     0.5 
Q_attitude_rp:  150.0   # Cost for attitude error           //default: 50     0.1
Q_attitude_yaw:  150.0    # Cost for attitude error           //default: 50     0.1
Q_velocity:  20.0   # Cost for velocity error           //default: 10    0.05

Q_payload_xy:  35.0
Q_payload_z: 35.0
Q_payload_velocity: 3.5
Q_cable: 0.0
Q_dcable: 0.0

# Cost on Inputs
R_thrust:    3.0 # Cost on thrust input            //default: 1
R_pitchroll:  3.0     # Cost on pitch and roll rate
R_yaw:        3.0     # Cost on yaw ratte

# Exponential scaling: W_i = W * exp(-i/N * cost_scaling).
# cost_scaling = 0 means no scaling W_i = W. 
state_cost_exponential: 0.5     # Scaling for state costs
input_cost_exponential: 0.5     # scaling for input costs

# Limits for inputs
max_bodyrate_xy:    3.0       # ~ pi [rad/s]
max_bodyrate_z:     1.2         # ~ pi*2/3 [rad/s]
min_thrust:         1.0       # ~ 20% gravity [N]
max_thrust:         60.0      # ~ 200% gravity [N]

# use ending pos for better ending tracking performance)
use_trajectory_ending_pos: true

# Print information such as timing to terminal
print_info:   false

# control fsm param
ctrl_freq_max: 100.0

# control fsm param for real-world experiments
max_manual_vel: 1.0
max_angle: 30  # Attitude angle limit in degree. A negative value means no limit.
low_voltage: -0.1 # 4S battery

filter:
    sample_freq_quad_acc: 400.0
    sample_freq_quad_omg: 400.0
    sample_freq_load_acc: 400.0
    sample_freq_load_omg: 400.0
    sample_freq_rpm: 400.0
    sample_freq_cable: 400.0
    sample_freq_dcable: 400.0

    cutoff_freq_quad_acc: 20.0
    cutoff_freq_quad_omg: 20.0 #0.0 means no filter
    cutoff_freq_load_acc: 20.0
    cutoff_freq_load_omg: 20.0
    cutoff_freq_rpm: 20.0
    cutoff_freq_cable: 20.0
    cutoff_freq_dcable: 20.0

force_estimator: # *
    type: pinn              # lbfgs | pinn
    kf: 8.98132e-9 # Also used in the thrust_model  # 卡尔曼滤波器增益系数

    sample_freq_fq: 400.0               # 四旋翼力信号的采样频率(Hz)
    sample_freq_fl: 400.0               # 负载力信号的采样频率(Hz)
    cutoff_freq_fq: 8.0                # 四旋翼力信号的低通滤波截止频率(Hz)
    cutoff_freq_fl: 8.0                # 负载力信号的低通滤波截止频率(Hz)
    imu_body_length: 0.66844507         # IMU到机体中心的距离(m)
    use_force_estimator: true           # 是否使用力估计器
    max_force: 3.0                      # 最大允许估计力值(N)
    max_queue: 80                       # 力估计器使用的最大队列长度
    force_observer_freq: 400.0          # 力观测器运行频率(Hz)
    var_weight: 100.0                    # 方差权重参数，用于力估计器计算
    pinn:
        model_path: /home/wangshengkai/autotrans_ws/src/AutoTrans/force_estimation_task9_v2.pt
        normalizer_path: /home/wangshengkai/autotrans_ws/src/AutoTrans/controller/payload_mpc_controller/models/normalizer_stats_task9_v2.json
        ema_alpha: 0.03                     # 指数移动平均的平滑系数
        failover_threshold: 8.0          # 故障切换阈值(N)

rc_reverse: # *
    roll: false
    pitch: true
    yaw: false
    throttle: true

thrust_model: # The model that maps thrust signal u(0~1) to real thrust force F(Unit:N): F=K1*Voltage^K2*(K3*u^2+(1-K3)*u). 
    print_value: false # display the value of “thr_scale_compensate” or “hover_percentage” during thrust model estimating.
    accurate_thrust_model: 0
    # 0 means use the scale factor to map thrust to commmand without online calibration
    # 1 means use the scale factor to map thrust to commmand with online calibration(use the rotor speed to calibrate the scale factor)
    # 2 means use the scale factor to map thrust to commmand with online calibration(use the IMU calibrate the scale factor. Confilct with the force estimator)

    # approximate thrust mapping parameters
    hover_percentage: 0.25  # Thrust percentage in Stabilize/Arco mode WITHOUT Payload
    # hover_percentage: 0.3
    filter_factor: 0.2
    noisy_imu: false # *

msg_timeout:
    odom: 0.5
    rc:   0.5
    cmd:  0.5
    imu:  0.5
    bat:  0.5